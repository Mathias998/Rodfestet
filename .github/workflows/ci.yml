name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: TypeScript + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Brug Node.js fra .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Installer afhængigheder
        run: npm ci

      - name: TypeScript-tjek
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
        env:
          # Kontaktformular-ruten håndterer manglende nøgle gracefully,
          # så bygget lykkes uden den.
          RESEND_API_KEY: ""
